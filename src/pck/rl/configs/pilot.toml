# The plan's pilot: Qwen3-1.7B, multi-turn tool calling (up to 6 calls per episode), eight
# training tasks, evaluated on held-out tasks (layer 20, outliers, an unseen error budget).
# Sized for the 8 GB RTX 5060, overnight per regime and seed:
#   uv run python -m pck.rl.train --config pilot --compare seed=0
# - env = "table": tool answers from the verdict and timing tables (`TableEpisode`); the
#   faithful but much slower alternative is env = "emulator" (CPU-model episodes).
# - generator = "hf": 1.7B weights do not fit twice in 8 GB (trainer plus a vLLM server).
#   On a bigger GPU add generator=vllm; for a quick trial on the RTX 5060 use
#   model=Qwen/Qwen3-0.6B generator=vllm steps=40.
# - Each episode's group runs in lockstep (one batched generation per turn).
name = "pilot"
model = "Qwen/Qwen3-1.7B"
lora_rank = 32
lora_alpha = 64
tasks = [
    "896x896-qwen2.5-0.5b-l12/q_proj",
    "896x896-qwen2.5-0.5b-l12/o_proj",
    "128x896-qwen2.5-0.5b-l12/k_proj",
    "4864x896-qwen2.5-0.5b-l12/gate_proj",
    "896x4864-qwen2.5-0.5b-l12/down_proj",
    "896x896-gauss",
    "1536x1536-student-t",
    "896x896-gauss-h32",
]
eval_tasks = [
    "896x896-qwen2.5-0.5b-l20/q_proj",
    "896x896-qwen2.5-0.5b-l20/o_proj",
    "896x4864-qwen2.5-0.5b-l20/down_proj",
    "1024x1000-outliers",
    "1024x1000-outliers-h128",
]
regime = "calibrated"
env = "table"
turns = 6
steps = 400
group = 4
prompts_per_step = 2
lr = 1e-4
kl = 0.02
max_new_tokens = 256
time_limit_min = "none"
eval_samples = 16
gradient_checkpointing = true
update_batch = 1  # multi-turn contexts are long (up to ~3k tokens)
warm_start_examples = 256
warm_start_epochs = 2
# With generator = "vllm": multi-turn episodes need longer sequences, so more KV cache.
vllm_max_model_len = 4096
vllm_gpu_memory = 0.45
