# About 10 minutes on an RTX 5060 with --compare (two regimes, ~4.5 min each plus eval):
# one real layer where activation sparsity passes the calibrated test and, in the timing
# table, is 11% faster than the best honest kernel; single-turn configs, rewards from the tables.
name = "smoke"
model = "Qwen/Qwen3-0.6B"
lora_rank = 16
lora_alpha = 32
tasks = ["896x896-qwen2.5-0.5b-l12/o_proj"]
regime = "calibrated"
env = "table"
turns = 1
steps = 400
group = 8
prompts_per_step = 2
lr = 3e-4
kl = 0.01
temperature = 1.0
max_new_tokens = 128
time_limit_min = 4.5
eval_samples = 32
