<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-labelledby="t d">
  <title id="t">A guessed tolerance lets a cheat through; a proven bound catches it</title>
  <desc id="d">The true answer is 100. An honest kernel returns 100.001 and passes both checkers. A cheating kernel that skips small numbers returns 99.9: it falls inside the guessed plus or minus 1 percent range and passes, but falls outside the proven rounding bound and is caught.</desc>
  <style>
    :root { --ink: #1f2328; --muted: #59636e; --line: #d1d9e0; --weak: #d9a400; --weak-fill: #fff3c4;
            --proof: #1f6feb; --proof-fill: #cfe2ff; --ok: #1a7f37; --bad: #cf222e; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e6edf3; --muted: #9198a1; --line: #3d444d; --weak: #e3b341; --weak-fill: #3b2e0a;
              --proof: #4493f8; --proof-fill: #0d2d5e; --ok: #3fb950; --bad: #f85149; }
    }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); font-size: 13px; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 13px; }
    .axis { stroke: var(--line); stroke-width: 2; }
    .truth { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .weak-band { fill: var(--weak-fill); stroke: var(--weak); stroke-width: 1.5; }
    .proof-band { fill: var(--proof-fill); stroke: var(--proof); stroke-width: 1.5; }
    .honest { fill: var(--ok); }
    .cheat { fill: var(--bad); }
    .ok { fill: var(--ok); font-weight: 700; font-size: 14px; }
    .bad { fill: var(--bad); font-weight: 700; font-size: 14px; }

    .a-honest, .a-cheat, .a-v1, .a-v2 { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .a-honest { animation-name: honest; }
    .a-cheat  { animation-name: cheat; }
    .a-v1     { animation-name: v1; }
    .a-v2     { animation-name: v2; }
    @keyframes honest { 0%, 8% { opacity: 0; transform: translateY(-26px); } 18%, 92% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes v1     { 0%, 20% { opacity: 0; } 26%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes cheat  { 0%, 36% { opacity: 0; transform: translateY(-26px); } 46%, 92% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes v2     { 0%, 50% { opacity: 0; } 58%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .a-honest, .a-cheat, .a-v1, .a-v2 { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <text x="24" y="32" class="label">The true answer is 100. Two kernels answer:</text>
  <circle cx="34" cy="54" r="6" class="honest"/><text x="46" y="59" class="small">honest: 100.001 (tiny rounding)</text>
  <circle cx="290" cy="54" r="6" class="cheat"/><text x="302" y="59" class="small">cheat: 99.9 (skipped small numbers to run faster)</text>

  <!-- row 1: guessed tolerance -->
  <text x="24" y="104" class="label">Guessed tolerance</text>
  <text x="24" y="122" class="muted">"within 1% is fine"</text>
  <rect x="210" y="94" width="400" height="28" rx="4" class="weak-band"/>
  <text x="210" y="138" class="muted">99</text><text x="596" y="138" class="muted">101</text>
  <line x1="410" y1="86" x2="410" y2="130" class="truth"/>
  <g class="a-honest"><circle cx="411" cy="108" r="7" class="honest"/></g>
  <g class="a-cheat"><circle cx="370" cy="108" r="7" class="cheat"/></g>
  <g class="a-v1"><text x="626" y="104" class="ok">honest: pass</text></g>
  <g class="a-v2"><text x="626" y="124" class="bad">cheat: pass (missed)</text></g>

  <!-- row 2: proven bound -->
  <text x="24" y="194" class="label">Proven bound</text>
  <text x="24" y="212" class="muted">max honest rounding, proven in Lean</text>
  <line x1="210" y1="198" x2="610" y2="198" class="axis"/>
  <rect x="402" y="184" width="16" height="28" rx="3" class="proof-band"/>
  <text x="378" y="230" class="muted">100 ± 0.006</text>
  <line x1="410" y1="176" x2="410" y2="220" class="truth"/>
  <g class="a-honest"><circle cx="411" cy="198" r="7" class="honest"/></g>
  <g class="a-cheat"><circle cx="370" cy="198" r="7" class="cheat"/></g>
  <g class="a-v1"><text x="626" y="194" class="ok">honest: pass</text></g>
  <g class="a-v2"><text x="626" y="214" class="bad">cheat: caught</text></g>

  <text x="24" y="270" class="muted">Same check, different "close enough": the proven range is exactly as wide as honest rounding can be.</text>
  <text x="24" y="290" class="muted">Honest work always passes, and cheats have no room to hide. (Not to scale.)</text>
</svg>
