name: CUDA

on:
  push:
    branches: [main]
    paths:
      - "src/pck/cuda/csrc/**"
      - ".github/workflows/cuda.yml"
  pull_request:
    paths:
      - "src/pck/cuda/csrc/**"
      - ".github/workflows/cuda.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-compile:
    name: CUDA compile (sm_120)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nvcc 12.8
        run: |
          curl -sSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq cuda-nvcc-12-8 cuda-cudart-dev-12-8
      - name: Compile kernels with warnings as errors
        run: |
          for f in src/pck/cuda/csrc/*.cu; do
            /usr/local/cuda-12.8/bin/nvcc -std=c++17 -O3 --fmad=false -arch=sm_120 \
              -Werror all-warnings -c "$f" -o /dev/null
          done
