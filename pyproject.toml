[project]
name = "pck"
version = "0.1.0"
description = "Proof-carrying kernels: runtime checksum checkers for GPU kernels with proven thresholds."
readme = "README.md"
authors = [{ name = "Udaya Bhaskar Cheepurupalli" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
gpu = ["torch>=2.8", "ninja>=1.11"]
models = ["transformers>=4.50", "accelerate>=1.0"]
rl = ["pck[gpu,models]", "peft>=0.13"]

[project.entry-points."vllm.general_plugins"]
pck_sampling_check = "pck.vllm_plugin:register"

[dependency-groups]
dev = [
    "clang-format>=21",
    "hypothesis>=6.100",
    "ml-dtypes>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pck"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "NPY",     # numpy-specific
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow Greek letters (tau, rho, gamma) in text

[tool.mypy]
files = ["src", "tests", "harness"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "peft", "peft.*", "vllm", "vllm.*"]
ignore_missing_imports = true

# Code on the optional GPU and RL dependencies: parts of torch are unannotated, and in
# CI (base install only) the dependencies are absent, so they type as Any there.
[[tool.mypy.overrides]]
module = [
    "pck.cuda.*",
    "pck.agent.sandbox",
    "pck.rl.train",
    "pck.rl.warmstart",
    "pck.vllm_plugin",
]
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["tests.*", "harness.*"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["gpu: needs the gpu extra; tests that run kernels also need a CUDA GPU"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pck"]
branch = true
# Code that needs the GPU, nvcc or the rl extra, which CI does not install: exercised by
# tests/gpu, tests/agent/test_sandbox.py and tests/rl on a machine that has them.
omit = [
    "*/pck/cuda/*",
    "*/pck/agent/sandbox.py",
    "*/pck/rl/train.py",
    "*/pck/rl/warmstart.py",
    "*/pck/vllm_plugin.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 95
