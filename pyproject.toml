[project]
name = "pck"
version = "0.1.0"
description = "Proof-carrying kernels: runtime checksum checkers for GPU kernels with proven thresholds."
readme = "README.md"
authors = [{ name = "Udaya Bhaskar Cheepurupalli" }]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "ml-dtypes>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pck"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "NPY",     # numpy-specific
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow Greek letters (tau, rho, gamma) in text

[tool.mypy]
files = ["src", "tests", "harness"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["tests.*", "harness.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pck"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
